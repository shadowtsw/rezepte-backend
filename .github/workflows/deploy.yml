name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build first: if lint, tests or build fail, the running container stays untouched.
      - name: Build
        run: docker compose build

      - name: Deploy
        run: docker compose up -d

      # Every build re-tags :beta, leaving the old image as <none>. Clean up so the disk doesn't fill.
      - name: Clean up old images
        if: always()
        run: docker image prune -f && docker builder prune -f --filter until=168h
